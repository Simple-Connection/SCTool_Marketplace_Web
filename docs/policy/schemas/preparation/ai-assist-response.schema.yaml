$schema: https://json-schema.org/draft/2020-12/schema
$id: marketplace://schemas/preparation/ai-assist-response
$defs:
  claim:
    type: object
    additionalProperties: false
    required: [subject_type, operation, object_type, state_owner, effect, authority, phase, relation]
    properties:
      subject_type: {type: string}
      operation: {type: string}
      object_type: {type: string}
      state_owner: {type: string}
      effect: {type: string}
      authority: {type: string}
      phase: {type: string}
      relation: {type: string}
  edge:
    type: object
    additionalProperties: false
    required: [from, relation, to]
    properties:
      from: {type: string}
      relation: {type: string}
      to: {type: string}
type: object
additionalProperties: false
required: [schema_version, proposal_type, claims]
properties:
  schema_version: {const: '1.0'}
  proposal_type: {enum: [CLAIM_NORMALIZATION, CLAIM_COMPLETION, RESPONSIBILITY_SPLIT]}
  claims:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/claim'}
  edges:
    type: array
    items: {$ref: '#/$defs/edge'}
  split_groups:
    type: array
    items:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: integer, minimum: 0}
  gap_hint: {enum: [NORMALIZATION_GAP, CLAIM_COMPLETION_GAP, VARIANT_GAP, ONTOLOGY_GAP]}
  notes: {type: string}
