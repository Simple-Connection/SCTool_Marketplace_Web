schema_version: "2.0"
document_type: marketplace_policy_index
repository: Simple-Connection/SCTool_Marketplace_Web
authority: MARKETPLACE_WEB_POLICY

governance:
  namespace:
    source: governance/namespace_rules.yaml
    source_mode: MANIFEST_BOUND_SOURCE_SET
    classifier: ../../.github/policy-tools/namespace-classifier/engine/classifier.py
    semantic_lock: ../../.github/policy-tools/namespace-classifier/generated/compiled_registry.lock.json
    namespace_membership_path_and_status_owner: governance/namespace_rules.yaml
  routing:
    policy: governance/routing_policy.yaml
  authority:
    policy: governance/authority_policy.yaml
  schemas:
    responsibility_policy: governance/schema_responsibility_policy.yaml

namespace_projection:
  local_duplicate_mapping: FORBIDDEN
  source_of_truth: governance/namespace_rules.yaml
