name: Deploy SCTool Marketplace

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Marketplace static site
        run: |
          find site/assets -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/validate-site.mjs
          node --test scripts/test-release-catalog-client.mjs
          node --test scripts/test-release-view-model.mjs
          node --test scripts/test-release-page-view.mjs
          node scripts/validate-simple-connection-provider-independence.mjs
          node --test scripts/test-simple-connection-provider-independence.mjs
          node --test scripts/test-simple-connection-public-release.mjs
          node --test scripts/test-dashboard-categories.mjs
          node --test scripts/test-marketplace-drawer.mjs
          node --test scripts/test-download-navigation.mjs

      - name: Validate Registry hosting boundary
        run: |
          node scripts/validate-registry-hosting.mjs
          node --test scripts/test-registry-hosting.mjs

      - name: Verify exact Registry handoff
        run: >-
          python scripts/verify-registry-handoff.py
          --lock deployment/registry-handoff/lock.json

      - name: Assemble single Pages artifact
        run: node scripts/prepare-pages.mjs --out _site

      - name: Materialize exact signed Registry distribution
        run: >-
          python scripts/verify-registry-handoff.py
          --lock deployment/registry-handoff/lock.json
          --materialize _site/registry

      - name: Validate assembled Pages artifact
        run: node scripts/validate-registry-hosting.mjs --site-root _site --require-registry

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify canonical Simple Connection release catalog
        id: simple_connection_catalog
        continue-on-error: true
        run: >-
          node scripts/verify-simple-connection-release-catalog.mjs
          --consumer-url "${{ steps.deployment.outputs.page_url }}"

      - name: Upload Simple Connection catalog verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simple-connection-release-catalog-evidence-${{ github.sha }}
          path: simple-connection-release-catalog-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify public Registry hosting exact bytes
        run: >-
          python scripts/verify-registry-handoff.py
          --lock deployment/registry-handoff/lock.json
          --public-base-url "${{ steps.deployment.outputs.page_url }}registry/"
          --deployment-evidence registry-hosting-deployment-evidence.json
          --target-revision "$GITHUB_SHA"

      - name: Upload Registry hosting deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: registry-hosting-deployment-evidence-${{ github.sha }}
          path: registry-hosting-deployment-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Simple Connection catalog verification
        if: always() && steps.simple_connection_catalog.outcome != 'success'
        run: |
          echo "Canonical Simple Connection release catalog verification failed." >&2
          exit 1
