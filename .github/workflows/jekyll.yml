name: Deploy SCTool Marketplace

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Marketplace static site
        run: |
          node --check site/assets/registry-client.js
          node --check site/assets/app.js
          node scripts/validate-site.mjs

      - name: Validate Registry hosting boundary
        run: |
          node scripts/validate-registry-hosting.mjs
          node --test scripts/test-registry-hosting.mjs

      - name: Assemble single Pages artifact
        run: node scripts/prepare-pages.mjs --out _site

      - name: Validate assembled Pages artifact
        run: node scripts/validate-registry-hosting.mjs --site-root _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
