name: Marketplace Policy Validation
on:
  pull_request:
    paths: ["docs/policy/**", ".github/policy-tools/**", ".github/workflows/policy-validation.yml"]
  push:
    branches: [main]
    paths: ["docs/policy/**", ".github/policy-tools/**", ".github/workflows/policy-validation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - run: python -m pip install PyYAML==6.0.2 jsonschema==4.26.0
      - run: python .github/policy-tools/policy-schema-validator.py
      - run: python .github/policy-tools/namespace-classifier/compiler/compile_rules.py --check
      - run: python .github/policy-tools/namespace-classifier/tests/test_core.py
